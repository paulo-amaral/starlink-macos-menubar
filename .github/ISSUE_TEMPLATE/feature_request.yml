name: Feature request
description: Suggest an idea for StarPulse
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: hardware
    attributes:
      label: Hardware
      options:
        - label: This needs data the dish or router exposes (I checked it is available)
